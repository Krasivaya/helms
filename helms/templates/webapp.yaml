apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
      - name: {{ .Values.appName }}
        image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: {{ .Values.port }}
        env:
        - name: {{ .Values.env.userName }}
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-user
        - name: {{ .Values.env.userPwd }}
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-password
        - name: {{ .Values.env.dbUrl }}
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.configmap.name }}
              key: mongo-url
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
spec:
  # type: NodePort
  selector:
    app: {{ .Values.appName }}
  ports:
    - protocol: {{ .Values.protocol }}
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      # nodePort: 30007